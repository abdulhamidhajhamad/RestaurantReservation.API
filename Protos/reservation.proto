syntax = "proto3";

option csharp_namespace = "RestaurantReservation.API.Protos";

package reservation;

service ReservationGrpc {
  rpc GetReservation (GetReservationRequest) returns (ReservationResponse);
  rpc ListReservations (ListReservationsRequest) returns (ListReservationsResponse);
  rpc CreateReservation (CreateReservationRequest) returns (ReservationResponse);
  rpc UpdateReservation (UpdateReservationRequest) returns (ReservationResponse);
  rpc DeleteReservation (DeleteReservationRequest) returns (DeleteReservationResponse);
}

message ReservationResponse {
  int32 reservation_id = 1;
  int32 customer_id = 2;
  int32 restaurant_id = 3;
  int32 table_id = 4;
  string reservation_date = 5;
  int32 party_size = 6;
}

message GetReservationRequest {
  int32 reservation_id = 1;
}

message ListReservationsRequest {}

message ListReservationsResponse {
  repeated ReservationResponse reservations = 1;
}

message CreateReservationRequest {
  int32 customer_id = 1;
  int32 restaurant_id = 2;
  int32 table_id = 3;
  string reservation_date = 4;
  int32 party_size = 5;
}

message UpdateReservationRequest {
  int32 reservation_id = 1;
  string reservation_date = 2;
  int32 party_size = 3;
}

message DeleteReservationRequest {
  int32 reservation_id = 1;
}

message DeleteReservationResponse {
  bool success = 1;
}